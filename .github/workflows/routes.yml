name: Inspect public routes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbdh-platform-bandwagon
  cancel-in-progress: false

jobs:
  routes:
    runs-on: ubuntu-latest
    environment: bandwagon-preview
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Inspect current server routes
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" 'readlink -f /var/www/pbdh-platform/current && sudo nginx -t && sudo systemctl is-active pbdh-platform srd-production'
