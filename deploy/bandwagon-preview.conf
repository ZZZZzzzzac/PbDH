server {
    listen 80;
    server_name 192.243.116.94;
    client_max_body_size 3m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = / { return 302 /pbdh/; }
    location = /pbdh { return 302 /pbdh/; }
    location /pbdh/ {
        root /var/www/pbdh-platform/current;
        try_files $uri $uri/ /pbdh/index.html;
    }
    location /pbdh_tools/ {
        root /var/www/pbdh-platform/current;
        try_files $uri $uri/ /pbdh_tools/index.html;
    }
    location = /api/health { proxy_pass http://127.0.0.1:8001; }
    # 仅用于公网连通性测试；完整应用通过 localhost SSH 转发验收。
    location /api/ { return 403; }
    location = /SRD { return 302 /SRD/; }
    location /SRD/api/ { return 403; }
    location /SRD/edit/ { return 403; }
    location /SRD/admin/ { return 403; }
    location /SRD/ { alias /srv/bandwagon-preview/srd/public/; }
}
