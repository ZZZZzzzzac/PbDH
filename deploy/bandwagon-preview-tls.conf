server {
    listen 80;
    server_name pbdh-preview.192.243.116.94.sslip.io;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pbdh-preview.192.243.116.94.sslip.io;
    ssl_certificate /etc/letsencrypt/live/pbdh-preview.192.243.116.94.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbdh-preview.192.243.116.94.sslip.io/privkey.pem;
    client_max_body_size 32m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = / { return 302 /pbdh/; }
    location = /pbdh { return 302 /pbdh/; }
    location /pbdh/ {
        root /var/www/pbdh-platform/current;
        try_files $uri $uri/ /pbdh/index.html;
    }
    location /pbdh_tools/ {
        root /var/www/pbdh-platform/current;
        try_files $uri $uri/ /pbdh_tools/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
