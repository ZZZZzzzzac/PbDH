<style>
  :root{
    --bg:#0b1020;
    --panel:rgba(255,255,255,0.04);
    --muted:rgba(255,255,255,0.75);
    --accent:#6366F1;
    /* 领域颜色定义 */
    --arcane: #8b5cf6;      /* 奥术 - 紫罗兰色 */
    --blade: #ef4444;       /* 利刃 - 正红色 */
    --bone: #f8fafc;        /* 骸骨 - 白色 */
    --codex: #3b82f6;        /* 典籍 - 蓝色 */
    --grace: #ec4899;       /* 优雅 - 粉红色 */
    --midnight: #94a3b8;    /* 午夜 - 灰黑色（调整为亮灰色确保可见） */
    --sage: #10b981;        /* 贤者 - 绿色 */
    --splendor: #f59e0b;    /* 辉耀 - 金黄色 */
    --valor: #f97316;       /* 勇气 - 橙黄色 */
    --dread: #574e91;      /* 恐怖 - 深紫色 */
    --blood: #dc2626;       /* 鲜血 - 血红色 */
  }

  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    color:#e6eef8;
    background:linear-gradient(180deg,#0b1020 0%,#0f1724 60%,#000 100%);
    min-height:100vh;
    padding:28px;
  }
  .container{
    max-width:980px;
    margin:0 auto;
    background:var(--panel);
    border-radius:16px;
    padding:22px;
    box-shadow:0 10px 30px rgba(2,6,23,0.6);
  }
  h1{margin:0 0 6px;font-size:28px}
  p.lead{margin:0 0 18px;color:var(--muted)}
  form{display:block}
  fieldset{
    border:1px solid rgba(255,255,255,0.03);
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    background:rgba(255,255,255,0.02);
    transition: border-color 0.3s ease, background-color 0.3s ease;
  }
  fieldset.answered {
    border-color: rgba(99,102,241,0.3);
    background: rgba(99,102,241,0.03);
  }
  legend{
    font-weight:600;
    margin-bottom:6px;
    font-size:16px;
    padding:0 8px;
    background:var(--panel);
    width:auto;
    transition: color 0.3s ease;
  }
  fieldset.answered legend {
    color: var(--accent);
  }

  /* 选项样式 - 每行一个 */
  .options-container{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .choice{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.05);
    transition:all 0.2s ease;
    background:rgba(255,255,255,0.02);
  }
  .choice:hover{
    border-color:rgba(99,102,241,0.3);
    background:rgba(99,102,241,0.02);
  }
  .choice.selected{
    border-color:rgba(99,102,241,0.9);
    background:rgba(99,102,241,0.08);
  }
  .choice input{
    flex-shrink:0;
    margin-top:2px;
    accent-color:var(--accent);
  }
  .choice-text{
    flex:1;
    font-size:15px;
    line-height:1.4;
  }
  .choice-letter{
    font-weight:600;
    color:var(--accent);
    margin-right:6px;
  }

  .btn{
    display:inline-block;
    padding:12px 20px;
    border-radius:8px;
    border:0;
    cursor:pointer;
    font-weight:600;
    font-size:15px;
    margin-right:10px;
    transition:all 0.2s ease;
  }
  .btn.primary{
    background:var(--accent);
    color:white;
  }
  .btn.primary:hover{
    background:#4f46e5;
    transform:translateY(-1px);
  }
  .btn.ghost{
    background:rgba(255,255,255,0.05);
    color:#e6eef8;
    border:1px solid rgba(255,255,255,0.1);
  }
  .btn.ghost:hover{
    background:rgba(255,255,255,0.1);
    transform:translateY(-1px);
  }
  .result{
    margin-top:18px;
    padding:18px;
    border-radius:10px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    margin-top:12px;
  }
  .card{
    padding:14px;
    border-radius:8px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.03);
    transition:all 0.2s ease;
  }
  .card:hover{
    border-color:rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
  }
  footer{
    margin-top:24px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,0.05);
  }
  footer a{
    color:#818cf8;
    text-decoration:none;
  }
  footer a:hover{
    text-decoration:underline;
  }

  /* 问题计数器 */
  .question-counter{
    display:inline-block;
    background:rgba(99,102,241,0.1);
    color:var(--accent);
    font-size:12px;
    padding:2px 8px;
    border-radius:12px;
    margin-left:8px;
  }

  .domain-arcane{color:var(--arcane);}
  .domain-blade{color:var(--blade);}
  .domain-bone{color:var(--bone);}
  .domain-codex{color:var(--codex);}
  .domain-grace{color:var(--grace);}
  .domain-midnight{color:var(--midnight);}
  .domain-sage{color:var(--sage);}
  .domain-splendor{color:var(--splendor);}
  .domain-valor{color:var(--valor);}
  .domain-dread{color:var(--dread);}
  .domain-blood{color:var(--blood);}

  .domain-name{
    font-weight:600;
    padding:2px 6px;
    border-radius:4px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
  }

  /* 优先级标签 */
  .priority-tag {
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
    margin-right: 8px;
    font-weight: 600;
  }
  .priority-1 { background: rgba(16, 185, 129, 0.2); color: #10b981; }
  .priority-2 { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
  .priority-3 { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
  .priority-4 { background: rgba(99, 102, 241, 0.2); color: #6366F1; }
  .priority-5 { background: rgba(99, 102, 241, 0.15); color: rgba(99, 102, 241, 0.8); }
  .priority-6 { background: rgba(99, 102, 241, 0.1); color: rgba(99, 102, 241, 0.6); }

  /* 未回答问题列表 */
  .unanswered-list {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    padding: 12px;
    margin-top: 12px;
  }
  .unanswered-list h4 {
    color: #ef4444;
    margin: 0 0 8px 0;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .unanswered-list ul {
    margin: 0;
    padding-left: 20px;
    color: rgba(255,255,255,0.8);
  }
  .unanswered-list li {
    margin-bottom: 4px;
    font-size: 13px;
  }
  .unanswered-list a {
    color: #818cf8;
    text-decoration: none;
    cursor: pointer;
  }
  .unanswered-list a:hover {
    text-decoration: underline;
  }

  @media (max-width:600px){
    body{padding:12px;}
    .container{padding:16px;}
    .choice{padding:10px;}
    .btn{display:block;width:100%;margin-bottom:8px;}
    .btn.primary{margin-bottom:12px;}
    legend{font-size:15px;}
  }
</style>

const form = document.getElementById('quizForm');
const answers = {};
const totalQuestions = questions.length;

// 存储问题元素引用，便于后续高亮
const questionElements = {};

function updateAnsweredCount() {
  const answered = Object.keys(answers).length;
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('totalQuestions').textContent = totalQuestions;
}

// 更新问题高亮状态
function updateQuestionHighlight(qid) {
  const fieldset = questionElements[qid];
  if (fieldset) {
    if (answers[qid]) {
      fieldset.classList.add('answered');
    } else {
      fieldset.classList.remove('answered');
    }
  }
}

// 获取未回答的问题列表
function getUnansweredQuestions() {
  const unanswered = [];
  for (let i = 1; i <= totalQuestions; i++) {
    if (!answers[i]) {
      unanswered.push(i);
    }
  }
  return unanswered;
}

// 跳转到指定问题
function scrollToQuestion(qid) {
  const fieldset = questionElements[qid];
  if (fieldset) {
    fieldset.scrollIntoView({ behavior: 'smooth', block: 'center' });
    // 添加短暂的闪烁效果
    fieldset.style.boxShadow = '0 0 0 3px rgba(99,102,241,0.5)';
    setTimeout(() => {
      fieldset.style.boxShadow = '';
    }, 1000);
  }
}

function createColoredDomainName(domain) {
  const color = domainColors[domain] || 'var(--accent)';
  return `<span class="domain-name" style="color: ${color}; border-color: ${color}60;">${domain}</span>`;
}

function makeChoiceElement(q) {
  const fs = document.createElement('fieldset');
  fs.id = `question-${q.id}`;
  const legend = document.createElement('legend');
  legend.innerHTML = q.q + ' <span class="question-counter">' + q.id + '/' + totalQuestions + '</span>';
  fs.appendChild(legend);

  const container = document.createElement('div');
  container.className = 'options-container';

  q.options.forEach((option, index) => {
    const choiceLetter = String.fromCharCode(65 + index); // A, B, C, D
    const label = document.createElement('label');
    label.className = 'choice';
    label.tabIndex = 0;

    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'q' + q.id;
    input.value = choiceLetter;

    input.addEventListener('change', () => {
      answers[q.id] = choiceLetter;
      updateSelectionStyles(fs, q.id);
      updateQuestionHighlight(q.id);
      updateAnsweredCount();
    });

    label.appendChild(input);

    const textDiv = document.createElement('div');
    textDiv.className = 'choice-text';
    textDiv.innerHTML = `<span class="choice-letter">${choiceLetter}.</span> ${option.text}`;

    label.appendChild(textDiv);

    label.addEventListener('click', (e) => {
      if(e.target.tagName.toLowerCase() !== 'input') {
        input.checked = true;
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });

    container.appendChild(label);
  });

  fs.appendChild(container);

  // 存储问题元素引用
  questionElements[q.id] = fs;

  // 初始高亮状态
  updateQuestionHighlight(q.id);

  return fs;
}

function updateSelectionStyles(fieldset, qid) {
  const labels = fieldset.querySelectorAll('label.choice');
  labels.forEach(label => {
    const input = label.querySelector('input');
    if(input && input.checked) label.classList.add('selected');
    else label.classList.remove('selected');
  });
}

/* build form */
questions.forEach(q => {
  const el = makeChoiceElement(q);
  form.appendChild(el);
});

// 初始化已回答数量显示
updateAnsweredCount();

/* calculate logic */
function calculate() {
  const scores = {};
  allDomains.forEach(d => scores[d] = 0);

  questions.forEach(q => {
    const choice = answers[q.id];
    if(!choice) return;

    const choiceIndex = choice.charCodeAt(0) - 65; // A=0, B=1, C=2, D=3
    const picked = q.options[choiceIndex];

    if(picked && picked.domains) {
      picked.domains.forEach(d => { scores[d] = (scores[d] || 0) + 1; });
    }
  });

  const ranked = Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({domain:k,score:v}));

  // 获取前三名领域
  const topDomain = ranked[0]?.domain;
  const secondDomain = ranked[1]?.domain;
  const thirdDomain = ranked[2]?.domain;

  // 计算职业匹配度
  const classScores = {};
  Object.entries(classes).forEach(([className, classData]) => {
    let score = 0;
    classData.domains.forEach(domain => {
      score += scores[domain] || 0;
    });
    const avgScore = score / classData.domains.length; // 计算平均分

    // 主要领域匹配度加分
    let bonus = 0;
    if (classData.primary === topDomain) {
      bonus = 5; // 主要领域与最适合领域匹配，大幅加分
    } else if (classData.primary === secondDomain) {
      bonus = 2; // 主要领域与第二适合领域匹配，适当加分
    }

    classScores[className] = avgScore + bonus;
  });

  // 排序职业（根据调整后的得分）
  const rankedClasses = Object.entries(classScores)
    .sort((a, b) => b[1] - a[1])
    .map(([name, score], index) => ({
      name,
      score,
      data: classes[name],
      rank: index + 1
    }));

  return { scores, ranked, rankedClasses, topDomain, secondDomain, thirdDomain };
}

/* render result */
const resultArea = document.getElementById('resultArea');
function renderResult(res) {
  resultArea.innerHTML = '';
  if(!res) return;

  const answeredCount = Object.keys(answers).length;
  const unansweredQuestions = getUnansweredQuestions();

  if (answeredCount < totalQuestions) {
    const warning = document.createElement('div');
    warning.className = 'result';

    // 构建未回答问题列表HTML
    let unansweredListHTML = '';
    if (unansweredQuestions.length > 0) {
      unansweredListHTML = `
        <div class="unanswered-list">
          <h4>⚠️ 以下题目未回答：</h4>
          <ul>
            ${unansweredQuestions.map(qid =>
              `<li>第 ${qid} 题：<a onclick="scrollToQuestion(${qid})" title="点击跳转到该题">${questions.find(q => q.id === qid).q.substring(0, 40)}...</a></li>`
            ).join('')}
          </ul>
        </div>
      `;
    }

    warning.innerHTML = `
      <div style="color: var(--splendor); margin-bottom: 12px;">
        ⚠️ 你只回答了 ${answeredCount}/${totalQuestions} 个问题
      </div>
      <p>建议完成所有问题以获得更准确的结果。是否继续查看当前结果？</p>
      ${unansweredListHTML}
      <div style="margin-top: 16px;">
        <button id="continueBtn" class="btn primary" style="margin-right: 10px;">继续查看结果</button>
        <button id="jumpToUnansweredBtn" class="btn ghost" ${unansweredQuestions.length === 0 ? 'disabled style="opacity:0.5"' : ''}>跳转到未回答题目</button>
      </div>
    `;
    resultArea.appendChild(warning);

    document.getElementById('continueBtn').addEventListener('click', () => {
      renderFullResult(res);
    });

    // 跳转到第一个未回答的题目
    if (unansweredQuestions.length > 0) {
      document.getElementById('jumpToUnansweredBtn').addEventListener('click', () => {
        scrollToQuestion(unansweredQuestions[0]);
      });
    }
  } else {
    renderFullResult(res);
  }
}

function renderFullResult(res) {
  resultArea.innerHTML = '';
  const top = res.ranked[0];
  const second = res.ranked[1];
  const third = res.ranked[2];

  // 获取前三名领域
  const topDomain = res.topDomain;
  const secondDomain = res.secondDomain;
  const thirdDomain = res.thirdDomain;

  const wrap = document.createElement('div');
  wrap.className = 'result';

  const h2 = document.createElement('h2');
  h2.textContent = '测试结果';
  h2.style.marginTop='0';
  wrap.appendChild(h2);

  const best = document.createElement('div');
  best.innerHTML = `
    <h3>最适合你的领域：</h3>
    <p style="font-size:20px;font-weight:700;margin:6px 0;">
      ${top ? createColoredDomainName(top.domain) : '—'}
    </p>
    <p style="opacity:0.9;margin-top:8px;">
      ${top ? domainDescriptions[top.domain].desc : ''}
    </p>
  `;
  wrap.appendChild(best);

  const others = document.createElement('div');
  others.innerHTML = '<h3 style="margin-top:16px">你也可以试着寻求其他力量：</h3>';
  const ul = document.createElement('ul');
  ul.style.marginTop='8px';
  ul.style.paddingLeft='20px';

  if(second) {
    const li = document.createElement('li');
    li.style.marginBottom='8px';
    li.innerHTML = `<strong>${createColoredDomainName(second.domain)}</strong> — ${domainDescriptions[second.domain].desc}`;
    ul.appendChild(li);
  }
  if(third) {
    const li2 = document.createElement('li');
    li2.style.marginBottom='8px';
    li2.innerHTML = `<strong>${createColoredDomainName(third.domain)}</strong> — ${domainDescriptions[third.domain].desc}`;
    ul.appendChild(li2);
  }
  others.appendChild(ul);
  wrap.appendChild(others);

  // 职业推荐部分 - 新的六优先级排序系统
  const classRecommendation = document.createElement('div');
  classRecommendation.innerHTML = '<h3 style="margin-top:18px">职业推荐：</h3>';

  const classGrid = document.createElement('div');
  classGrid.className = 'grid';

  // 获取所有职业并按新优先级排序
  const allClasses = res.rankedClasses.map(c => c);

  // 新的六优先级分组系统
  const priorityGroups = [[], [], [], [], [], []]; // 6个优先级组

  allClasses.forEach(classInfo => {
    const classDomains = classInfo.data.domains;
    const classPrimary = classInfo.data.primary;

    // 检查优先级1：得分第一的领域+得分第二的领域构成的职业
    if (classDomains.length === 2 &&
        classDomains.includes(topDomain) &&
        classDomains.includes(secondDomain)) {
      priorityGroups[0].push(classInfo);
    }
    // 检查优先级2：得分第一的领域+得分第三的领域构成的职业
    else if (classDomains.length === 2 &&
             classDomains.includes(topDomain) &&
             classDomains.includes(thirdDomain)) {
      priorityGroups[1].push(classInfo);
    }
    // 检查优先级3：得分第二的领域+得分第三的领域构成的职业
    else if (classDomains.length === 2 &&
             classDomains.includes(secondDomain) &&
             classDomains.includes(thirdDomain)) {
      priorityGroups[2].push(classInfo);
    }
    // 检查优先级4：以得分第一的领域为主要领域的职业
    else if (classPrimary === topDomain) {
      priorityGroups[3].push(classInfo);
    }
    // 检查优先级5：以得分第二的领域为主要领域的职业
    else if (classPrimary === secondDomain) {
      priorityGroups[4].push(classInfo);
    }
    // 检查优先级6：以得分第三的领域为主要领域的职业
    else if (classPrimary === thirdDomain) {
      priorityGroups[5].push(classInfo);
    }
    // 其他职业（不属于任何优先级）不显示在推荐中
  });

  // 在每个优先级组内部按照最终得分排序
  priorityGroups.forEach(group => {
    group.sort((a, b) => b.score - a.score);
  });

  // 合并所有优先级组，按顺序取前3个职业
  const sortedClasses = [];
  for (let i = 0; i < priorityGroups.length; i++) {
    if (sortedClasses.length >= 3) break;

    // 为组内每个职业添加优先级标签
    priorityGroups[i].forEach(classInfo => {
      if (sortedClasses.length < 3) {
        classInfo.priorityLevel = i + 1;
        sortedClasses.push(classInfo);
      }
    });
  }

  // 添加优先级标签说明
  if (sortedClasses.length > 0) {
    const priorityNote = document.createElement('div');
    priorityNote.style.color = 'var(--accent)';
    priorityNote.style.fontSize = '14px';
    priorityNote.style.marginBottom = '12px';
    priorityNote.innerHTML = '💡 职业按照与你的领域匹配度从高到低排序。';
    classRecommendation.appendChild(priorityNote);
  }

  // 显示前三个职业
  sortedClasses.forEach((classInfo, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    // 根据优先级设置不同的样式
    let priorityLabel = '';
    let borderStyle = '';
    let titleColor = '';

    switch(classInfo.priorityLevel) {
      case 1:
        priorityLabel = `<span class="priority-tag priority-1">${topDomain} + ${secondDomain}</span>`;
        borderStyle = '2px solid #10b981';
        titleColor = '#10b981';
        break;
      case 2:
        priorityLabel = `<span class="priority-tag priority-2">${topDomain} + ${thirdDomain}</span>`;
        borderStyle = '2px solid #3b82f6';
        titleColor = '#3b82f6';
        break;
      case 3:
        priorityLabel = `<span class="priority-tag priority-3">${secondDomain} + ${thirdDomain}</span>`;
        borderStyle = '2px solid #8b5cf6';
        titleColor = '#8b5cf6';
        break;
      case 4:
        priorityLabel = `<span class="priority-tag priority-4">主要领域: ${topDomain}</span>`;
        borderStyle = '1px solid rgba(99,102,241,0.7)';
        titleColor = 'rgba(99,102,241,0.9)';
        break;
      case 5:
        priorityLabel = `<span class="priority-tag priority-5">主要领域: ${secondDomain}</span>`;
        borderStyle = '1px solid rgba(99,102,241,0.4)';
        titleColor = 'rgba(99,102,241,0.7)';
        break;
      case 6:
        priorityLabel = `<span class="priority-tag priority-6">主要领域: ${thirdDomain}</span>`;
        borderStyle = '1px solid rgba(99,102,241,0.3)';
        titleColor = 'rgba(99,102,241,0.5)';
        break;
    }

    card.style.border = borderStyle;
    card.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';

    card.innerHTML = `
      <div style="display:flex;align-items:center;margin-bottom:8px;">
        ${priorityLabel}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <strong style="color: ${titleColor}">${classInfo.name}</strong>
      </div>
      <div style="margin-top:8px;color:rgba(255,255,255,0.85)">${classInfo.data.description}</div>
      <div style="margin-top:8px; font-size: 13px;">
        关联领域：${classInfo.data.domains.map(d => createColoredDomainName(d)).join(' ')}
      </div>
    `;
    classGrid.appendChild(card);
  });

  classRecommendation.appendChild(classGrid);
  const recommendedClass = sortedClasses[0];
  const recommendedClassId = recommendedClass ? classResourceIds[recommendedClass.name] : null;
  if (recommendedClass && recommendedClassId) {
    const applyButton = document.createElement('button');
    applyButton.className = 'btn primary';
    applyButton.type = 'button';
    applyButton.style.marginTop = '12px';
    applyButton.textContent = `将“${recommendedClass.name}”填入人物卡`;
    applyButton.addEventListener('click', () => {
      window.parent.postMessage({
        type: 'pbdh-questionnaire-result',
        result: {
          protocolVersion: '1',
          interactions: [{
            type: 'resourceSelected',
            sourceModuleId: 'pick-class',
            libraryId: 'classes',
            entryIds: [recommendedClassId]
          }]
        }
      }, '*');
    });
    classRecommendation.appendChild(applyButton);
  }
  wrap.appendChild(classRecommendation);

  const allTitle = document.createElement('h3');
  allTitle.textContent='完整得分：';
  allTitle.style.marginTop='20px';
  wrap.appendChild(allTitle);

  const grid = document.createElement('div');
  grid.className='grid';
  res.ranked.forEach(r => {
    const card = document.createElement('div');
    card.className='card';
    const domainInfo = domainDescriptions[r.domain];
    const color = domainInfo ? domainInfo.color : 'var(--accent)';

    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <strong style="color:${color}">${r.domain}</strong>
        <span style="opacity:0.85">${r.score} 分</span>
      </div>
      <div style="margin-top:6px;color:rgba(255,255,255,0.85)">
        ${domainInfo ? domainInfo.desc : ''}
      </div>
    `;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  resultArea.appendChild(wrap);
  resultArea.scrollIntoView({behavior:'smooth'});
}

/* button handlers */
document.getElementById('calcBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  const res = calculate();
  renderResult(res);
});

document.getElementById('resetBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  const inputs = document.querySelectorAll('input[type=radio]');
  inputs.forEach(i=>{ i.checked = false; });
  for(const k in answers) delete answers[k];
  const labels = document.querySelectorAll('label.choice');
  labels.forEach(l=>l.classList.remove('selected'));

  // 清除所有问题高亮
  Object.keys(questionElements).forEach(qid => {
    updateQuestionHighlight(qid);
  });

  resultArea.innerHTML = '';
  updateAnsweredCount();
  window.scrollTo({top:0,behavior:'smooth'});
});

document.querySelectorAll('label.choice').forEach(label=>{
  label.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' ') {
      const input = label.querySelector('input');
      if(input) {
        input.checked = true;
        input.dispatchEvent(new Event('change',{bubbles:true}));
      }
      e.preventDefault();
    }
  });
});

</script>
